<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>share card source</title>

<!--
  Source for assets/share-card.png. Rendered by tools/build-share-card.sh
  through headless Chrome at exactly 1200x630.

  It imports the site's own tokens, so the card can never drift from the
  palette or type stack it is advertising — change tokens.css and the card
  changes with it on the next build.
-->
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    background: var(--void);
    color: var(--text);
    font-family: var(--grotesk);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 78px;
  }

  /* The two accents, as they sit after the debris cools. */
  .bloom {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(52% 78% at 82% 12%, rgba(61, 245, 196, 0.20), transparent 62%),
      radial-gradient(46% 62% at 96% 74%, rgba(139, 123, 255, 0.18), transparent 66%);
  }

  .rule {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--edge);
  }
  .rule--top { top: 96px; }
  .rule--bottom { bottom: 96px; }

  .content { position: relative; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 30px;
    white-space: nowrap;
  }

  h1 {
    font-size: 92px;
    line-height: 0.94;
    letter-spacing: -0.045em;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 30px;
  }
  h1 .outline {
    display: block;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--edge-2);
  }

  p {
    font-size: 27px;
    line-height: 1.4;
    color: var(--dim);
    max-width: 33ch;
    letter-spacing: -0.012em;
    text-wrap: balance;
  }
  p b { color: var(--text); font-weight: 500; }

  .chips {
    position: absolute;
    left: 78px;
    bottom: 38px;
    display: flex;
    gap: 12px;
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .chips span {
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 7px 14px;
  }
  .chips span:first-child {
    color: var(--mint);
    border-color: rgba(61, 245, 196, 0.4);
  }

  .url {
    position: absolute;
    right: 78px;
    bottom: 38px;
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 0.1em;
    color: var(--faint);
  }

  /* The singularity, echoing the favicon and the opening. */
  .point {
    position: absolute;
    right: 132px;
    top: 50%;
    width: 15px;
    height: 15px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
      0 0 34px 12px rgba(61, 245, 196, 0.85),
      0 0 120px 46px rgba(139, 123, 255, 0.34);
  }
  .ring {
    position: absolute;
    right: 62px;
    top: 50%;
    width: 160px;
    height: 160px;
    margin-top: -80px;
    border: 1px solid rgba(61, 245, 196, 0.32);
    border-radius: 50%;
  }
  .ring--2 {
    right: 22px;
    width: 240px;
    height: 240px;
    margin-top: -120px;
    border-color: rgba(139, 123, 255, 0.22);
    border-style: dashed;
  }
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="rule rule--top"></div>
  <div class="rule rule--bottom"></div>

  <div class="ring ring--2"></div>
  <div class="ring"></div>
  <div class="point"></div>

  <div class="content">
    <p class="eyebrow">AI-Native Software Engineer</p>
    <h1>Ambassador<span class="outline">Eugene</span></h1>
    <p>Agent systems, LLM guardrails and production AI infrastructure. <b>Built entirely with AI.</b></p>
  </div>

  <div class="chips">
    <span>3 case studies</span>
    <span>Agent orchestration</span>
    <span>Guardrails</span>
    <span>10 yrs</span>
  </div>
  <div class="url">github.com/AmbassEugene</div>
</body>
</html>
